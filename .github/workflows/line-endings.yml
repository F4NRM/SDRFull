name: line-endings

# CRLF must not be possible in this repository: every tracked text file is LF
# (see `.gitattributes`). This job fails a push or a pull request that adds a
# text file whose blob in the index holds CRLF, or a mix of both. Files marked
# `-text` in `.gitattributes` (binary files, and the few data files that carry
# CRLF on purpose) are not looked at. A contributor sees the same refusal
# locally by running `git ls-files --eol` and looking for `i/crlf`.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lf-only:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: No CRLF in tracked text files
        run: |
          # Column 3 is the attribute: "attr/-text" marks the files kept byte for byte.
          bad=$(git ls-files --eol | awk '($1=="i/crlf" || $1=="i/mixed") && $3 !~ /-text/ {print $1, $NF}')
          if [ -n "$bad" ]; then
            echo "These files hold CRLF in the index. Use LF (see .gitattributes):"
            echo "$bad"
            exit 1
          fi
          echo "All tracked text files are LF."
