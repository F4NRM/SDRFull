# Vending machines — the desktop's palette, for sdroxide.
#
# Cool grey-green ground, one orange accent, and a soft amber for the things
# that were cyan: the colours of a lit machine at night rather than a warm
# room. Every role has to be here; one that is missing is refused by name and
# the built-in theme stays in force.

name = "Vending machines"

[palette]
light = false
no_dim = false
bg_deep = "#141a1a"
panel = "#1e2424"
input_bg = "#1a2020"
fill = "#242c2b"
fill_hover = "#333b39"
fill_active = "#3e4744"
line = "#586360"
